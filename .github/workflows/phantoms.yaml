name: phantoms
on:
  workflow_call:
  push:
    branches:
      - main
      - switch-phantoms-to-s3
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  phantoms:
    runs-on: ${{ matrix.runner }}
    env:
      DCM2NIIX_WIN_PATH: dcm2niix_win/dcm2niix.exe
      MATLAB_CODE_PATH: ${{ github.workspace }}/matlab/
      METADATA_PATH: ${{ github.workspace }}/metadata/

    strategy:
      matrix:
        include:
          - python: "3.12"
            os: ubuntu-latest
            runner: [self-hosted, linux, x64, pet2bids-matlab, r2026a]
          - python: "3.12"
            os: windows-latest
            runner: windows-latest
          - python: "3.12"
            os: macOS-latest
            runner: macOS-latest
      fail-fast: false

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache Node Posix
        if: runner.os != 'Windows' && env.ACT != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-bids-validator-1.14.6

      - name: Cache Phantoms
        if: env.ACT != 'true'
        id: cache-phantoms
        uses: actions/cache@v6
        env:
          cache-name: cache-phantoms
        with:
          path: PHANTOMS.zip
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('PHANTOMS.zip') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-
            ${{ runner.os }}-

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up UV
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install Python Dependencies
        run: |
          cd pypet2bids
          python -m pip install -e .

      - name: Install UV Build Package
        run: |
          make buildpackage
          cd pypet2bids && uv pip install dist/pypet2bids-*.whl --system
          dcm2niix4pet -h

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install BIDS Validator
        run: npm install -g bids-validator@1.14.6

      - name: Collect Phantoms (Linux/macOS)
        if: steps.cache-phantoms.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: wget -O PHANTOMS.zip https://openneuropet.s3.amazonaws.com/US-sourced-OpenNeuroPET-Phantoms.zip

      - name: Collect Phantoms (Windows)
        if: steps.cache-phantoms.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: Invoke-WebRequest -Uri "https://openneuropet.s3.amazonaws.com/US-sourced-OpenNeuroPET-Phantoms.zip" -OutFile "PHANTOMS.zip"

      - name: Debug
        uses: mxschmitt/action-tmate@v3
        if: github.event_name == 'workflow_dispatch' && inputs.debug_enabled
        timeout-minutes: 15
        with:
          limit-access-to-actor: true

      - name: Decompress phantoms windows
        if: runner.os == 'Windows'
        run: |
          powershell -command "Expand-Archive PHANTOMS.zip -Force"
          # Move contents from PHANTOMS/OpenNeuroPET-Phantoms/ to OpenNeuroPET-Phantoms/
          mv PHANTOMS/OpenNeuroPET-Phantoms .

      - name: Decompress phantoms posix
        if: runner.os != 'Windows'
        run: unzip -o PHANTOMS.zip

      - name: Copy Conversion Scripts from Version Control (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p OpenNeuroPET-Phantoms/code/
          cp scripts/matlab_conversions.m OpenNeuroPET-Phantoms/code/matlab_conversions.m
          cp scripts/python_conversions.sh OpenNeuroPET-Phantoms/code/python_conversions.sh

      - name: Copy Conversion Scripts from Version Control (Windows)
        if: runner.os == 'Windows'
        run: |
          cp scripts/python_conversions.sh OpenNeuroPET-Phantoms/code/python_conversions.sh

      - name: Run Python Conversion Script on Phantoms
        run: |
          cd OpenNeuroPET-Phantoms/code
          bash python_conversions.sh

      - name: Run Matlab Conversion Script on Phantoms
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: >-
          matlab -batch "addpath('${{ github.workspace }}/OpenNeuroPET-Phantoms/code');
          addpath('${{ env.MATLAB_CODE_PATH }}');
          addpath('${{ env.MATLAB_CODE_PATH }}/unit_tests');
          addpath('${{ env.MATLAB_CODE_PATH }}/template_txt');
          addpath('${{ env.METADATA_PATH }}');
          matlab_conversions"

      - name: Check Parity
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          python scripts/compare_jsons.py OpenNeuroPET-Phantoms/python OpenNeuroPET-Phantoms/matlab

      - name: Validate Python Conversion
        run: |
          bids-validator OpenNeuroPET-Phantoms/python


      - name: Validate Matlab Conversion
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: |
          bids-validator OpenNeuroPET-Phantoms/matlab

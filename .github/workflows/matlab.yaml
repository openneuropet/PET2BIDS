name: matlab
on:
  push:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
      inputs:
        debug_enabled:
          type: boolean
          description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
          required: false
          default: false


jobs:
  Matlab-Unit-Tests:
    runs-on: [self-hosted, linux, x64, pet2bids-matlab, r2026a]

    env:
      TEST_ECAT_PATH: ${{ github.workspace }}/ecat_validation/synthetic_ecat_integer.v.gz
      MATLAB_CODE_PATH: ${{ github.workspace }}/matlab/
      METADATA_PATH: ${{ github.workspace }}/metadata/

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Debug
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        timeout-minutes: 15
        with:
          limit-access-to-actor: true

      - name: Run Tests with Installed MATLAB
        shell: bash
        run: >-
          matlab -batch "addpath('${{ env.MATLAB_CODE_PATH }}');
          addpath('${{ env.MATLAB_CODE_PATH }}/unit_tests');
          addpath('${{ env.MATLAB_CODE_PATH }}/template_txt');
          addpath('${{ env.METADATA_PATH }}');
          ecat2nii_test"

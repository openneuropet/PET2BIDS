name: windows
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
jobs:
  GetDcm2niix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python: ['3.10', '3.14']

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          cd pypet2bids
          python -m pip install .

      - name: Use CLI to set path to dcm2niix
        run: |
          cd pypet2bids
          python -c "import subprocess; from pypet2bids.dcm2niix4pet import use_included_binary; binary = use_included_binary(); assert binary; subprocess.run(['dcm2niix4pet', '--set-dcm2niix-path', str(binary)], check=True)"
